# 服务器端口（Kimi Work 预览使用 7100）
server.port=${PORT:7100}
spring.application.name=growth-dashboard
spring.jackson.serialization.write-dates-as-timestamps=false
# 前后端分离后由前端 Nginx 托管静态资源；旧 static 文件保留但不映射。
spring.web.resources.add-mappings=false
spring.web.resources.static-locations=classpath:/api-static-disabled/
spring.mvc.static-path-pattern=/api-static-disabled/**

# 文件上传限制（文档识别）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== 前端会话与跨域 ====================
# 生产必须显式配置 FRONTEND_ORIGINS=https://dashboard.example.com 与 COOKIE_SECURE=true。
# 多个前端 Origin 用逗号分隔；VITE_API_PROXY_TARGET 仅供前端 Vite 开发代理使用。
app.frontend-origins=${FRONTEND_ORIGINS:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}

# ==================== 数据存储（JPA） ====================
# 默认：内嵌 H2 数据库（单文件，免安装，文件位于运行目录 data/dashboarddb）
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/dashboarddb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 云服务器部署时切换为 MySQL（驱动已打包，修改以下配置或用环境变量 DB_URL/DB_USER/DB_PASSWORD 注入）：
# spring.datasource.url=jdbc:mysql://<主机>:3306/dashboard?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=<密码>
# MySQL 需先建库：CREATE DATABASE dashboard DEFAULT CHARSET utf8mb4;

# ==================== AI 接口配置 ====================
# provider: local（内置规则引擎，无需联网）或 openai-compatible（任何兼容 OpenAI Chat Completions 的服务）
ai.provider=${AI_PROVIDER:openai-compatible}
# OpenAI 兼容服务地址，例如：
#   https://api.openai.com/v1
#   https://api.deepseek.com/v1
#   https://dashscope.aliyuncs.com/compatible-mode/v1
#   http://localhost:11434/v1   (Ollama 本地模型)
ai.base-url=${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
# API Key：为空时自动回退到内置 local 规则引擎，页面功能照常可用
ai.api-key=${AI_API_KEY:}
# 模型名称
ai.model=${AI_MODEL:qwen3.8-flash}
# 请求超时（秒）
ai.timeout-seconds=${AI_TIMEOUT:60}
