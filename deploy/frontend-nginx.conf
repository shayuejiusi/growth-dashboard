# 前端站点：将 dashboard.example.com、api.example.com 和证书路径替换为部署占位值。
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name dashboard.example.com;
    return 301 https://dashboard.example.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dashboard.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;

    root /srv/growth-dashboard/frontend/current;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 同源 /api 由前端站点转发到独立 API 站点，未知 API 不会返回 index.html。
    location ^~ /api/ {
        proxy_pass https://api.example.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.example.com;
        proxy_set_header Host api.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host dashboard.example.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
        error_page 502 = @bad_gateway;
        error_page 503 = @upstream_unavailable;
        error_page 504 = @gateway_timeout;
    }

    location = /api {
        default_type application/json;
        return 404 '{"timestamp":"$time_iso8601","status":404,"code":"NOT_FOUND","message":"API endpoint not found","path":"/api","requestId":"$request_id"}';
    }

    location = /api/ {
        default_type application/json;
        return 404 '{"timestamp":"$time_iso8601","status":404,"code":"NOT_FOUND","message":"API endpoint not found","path":"/api","requestId":"$request_id"}';
    }

    location @bad_gateway {
        default_type application/json;
        return 502 '{"timestamp":"$time_iso8601","status":502,"code":"BAD_GATEWAY","message":"Upstream API returned an invalid response","path":"/api","requestId":"$request_id"}';
    }

    location @upstream_unavailable {
        default_type application/json;
        return 503 '{"timestamp":"$time_iso8601","status":503,"code":"UPSTREAM_UNAVAILABLE","message":"Upstream API is unavailable","path":"/api","requestId":"$request_id"}';
    }

    location @gateway_timeout {
        default_type application/json;
        return 504 '{"timestamp":"$time_iso8601","status":504,"code":"GATEWAY_TIMEOUT","message":"Upstream API timed out","path":"/api","requestId":"$request_id"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
