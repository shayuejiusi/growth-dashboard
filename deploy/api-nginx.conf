# API 站点：仅公开 /api/**，后端 7100 只监听或放行至本机。
# 将 192.0.2.10 替换为前端代理的实际出口 IP；未命中白名单的直连忽略公网转发头。
map $remote_addr $dashboard_from_frontend {
    default 0;
    192.0.2.10 1;
    127.0.0.1 1;
    ::1 1;
}

map $dashboard_from_frontend $dashboard_client_ip {
    1 $http_x_forwarded_for;
    0 $remote_addr;
}

map $dashboard_from_frontend $dashboard_forwarded_for {
    1 $proxy_add_x_forwarded_for;
    0 $remote_addr;
}

map $dashboard_from_frontend $dashboard_forwarded_host {
    1 $http_x_forwarded_host;
    0 $host;
}

map $dashboard_from_frontend $dashboard_forwarded_proto {
    1 $http_x_forwarded_proto;
    0 $scheme;
}

map $http_x_request_id $dashboard_request_id {
    "" $request_id;
    default $http_x_request_id;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://api.example.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:7100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $dashboard_client_ip;
        proxy_set_header X-Request-ID $dashboard_request_id;
        proxy_set_header X-Forwarded-For $dashboard_forwarded_for;
        proxy_set_header X-Forwarded-Host $dashboard_forwarded_host;
        proxy_set_header X-Forwarded-Proto $dashboard_forwarded_proto;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
        error_page 502 = @bad_gateway;
        error_page 503 = @upstream_unavailable;
        error_page 504 = @gateway_timeout;
    }

    location = /api {
        default_type application/json;
        return 404 '{"timestamp":"$time_iso8601","status":404,"code":"NOT_FOUND","message":"API endpoint not found","path":"$uri","requestId":"$dashboard_request_id"}';
    }

    location = /api/ {
        default_type application/json;
        return 404 '{"timestamp":"$time_iso8601","status":404,"code":"NOT_FOUND","message":"API endpoint not found","path":"$uri","requestId":"$dashboard_request_id"}';
    }

    location @bad_gateway {
        default_type application/json;
        return 502 '{"timestamp":"$time_iso8601","status":502,"code":"BAD_GATEWAY","message":"Backend returned an invalid response","path":"$uri","requestId":"$dashboard_request_id"}';
    }

    location @upstream_unavailable {
        default_type application/json;
        return 503 '{"timestamp":"$time_iso8601","status":503,"code":"UPSTREAM_UNAVAILABLE","message":"Backend is unavailable","path":"$uri","requestId":"$dashboard_request_id"}';
    }

    location @gateway_timeout {
        default_type application/json;
        return 504 '{"timestamp":"$time_iso8601","status":504,"code":"GATEWAY_TIMEOUT","message":"Backend timed out","path":"$uri","requestId":"$dashboard_request_id"}';
    }

    location / {
        return 404;
    }
}
